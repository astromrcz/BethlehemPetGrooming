<div class="min-h-screen flex">

      <!-- Mobile sidebar toggle -->
      <button
        type="button"
        id="clientSidebarToggle"
        class="fixed left-4 top-4 z-[60] hidden h-12 w-12 items-center justify-center rounded-full border border-portal-border bg-portal-surface-soft text-portal-primary shadow-portal transition-[background-color,transform] duration-200 ease-[ease] hover:-translate-y-px hover:bg-portal-active max-[1180px]:inline-flex"
        aria-controls="clientSidebar"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        <svg class="ph-icon w-5 h-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#list"></use></svg>
      </button>

      <button
        type="button"
        id="clientSidebarBackdrop"
        class="fixed inset-0 z-[95] invisible hidden border-0 bg-[rgba(44,62,80,0.28)] p-0 opacity-0 pointer-events-none transition-[opacity,visibility] duration-[240ms] ease-[ease] max-[1180px]:block max-[1180px]:group-[.client-sidebar-open]/portal:visible max-[1180px]:group-[.client-sidebar-open]/portal:opacity-100 max-[1180px]:group-[.client-sidebar-open]/portal:pointer-events-auto"
        aria-label="Close navigation menu"
      ></button>

      <!-- ===================================================== -->
      <!-- SIDEBAR -->
      <!-- Fixed sidebar for client dashboard navigation -->
      <!-- Backend note: active page state can be set dynamically -->
      <!-- ===================================================== -->
      <aside
        id="clientSidebar"
        class="fixed left-0 top-0 z-40 flex h-screen supports-[height:100dvh]:h-dvh w-64 flex-col justify-between overflow-y-auto border-r border-portal-border bg-portal-sidebar text-portal-text shadow-none transition-[transform,box-shadow] duration-[240ms] ease-[ease] max-[1180px]:w-[min(288px,calc(100vw-40px))] max-[1180px]:-translate-x-[110%] max-[1180px]:z-[100] max-[1180px]:group-[.client-sidebar-open]/portal:translate-x-0 max-[1180px]:group-[.client-sidebar-open]/portal:shadow-[0_24px_48px_rgba(15,23,42,0.22)]"
      >
        <div>
          <!-- Clinic Branding -->
          <div class="px-6 pt-[25px] pb-5">
            <div class="flex items-start justify-between gap-4">
              <a
                href="#"
                class="flex items-center gap-3"
              >
                <div
                  class="flex items-center justify-center h-[52px] w-12 flex-none rounded-[14px] border border-portal-border bg-portal-surface p-[5px]"
                >
                  <img
                    src="/assets/images/clinic/Bethlehem_Logo-256.png"
                    alt="Bethlehem Animal Clinic logo"
                    width="256"
                    height="341"
                    decoding="async"
                    class="h-full w-full object-contain"
                  />
                </div>
                <div>
                  <h1 class="font-bold leading-tight text-[16px]">
                    Bethlehem Animal Clinic
                  </h1>
                  <p class="text-sm mt-[3px] text-portal-muted">Client Portal</p>
                </div>
              </a>

              <button
                type="button"
                id="clientSidebarClose"
                class="hidden h-8 w-8 shrink-0 items-center justify-center rounded-full border border-portal-border bg-portal-surface-soft text-portal-primary shadow-portal transition-colors duration-200 ease-[ease] hover:bg-portal-active max-[1180px]:inline-flex"
                aria-label="Close navigation menu"
              >
                <svg class="ph-icon w-5 h-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#x"></use></svg>
              </button>
            </div>
          </div>

          <!-- Navigation -->
          <nav class="grid gap-[7px] p-4" aria-label="Customer navigation">
            <p
              class="text-xs tracking-[0.2em] uppercase mx-3 mb-[3px] text-portal-muted"
            >
              Menu
            </p>

            <a
              href="#"
              class="portal-nav-item font-medium"
            >
              <svg class="ph-icon w-[21px] h-[21px]" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#squares-four"></use></svg>
              <span>Dashboard</span>
            </a>

            <a
              href="#"
              class="portal-nav-item font-medium"
            >
              <svg class="ph-icon w-[21px] h-[21px]" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#paw-print"></use></svg>
              <span>My Pets</span>
            </a>

            <a
              href="#"
              aria-current="page"
              class="portal-nav-item font-medium"
            >
              <svg class="ph-icon w-[21px] h-[21px]" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#clipboard-text"></use></svg>
              <span>Grooming History</span>
            </a>

            <a
              href="#"
              class="portal-nav-item font-medium"
            >
              <svg class="ph-icon w-[21px] h-[21px]" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#gear"></use></svg>
              <span>Settings</span>
            </a>
          </nav>
        </div>

        <!-- Client Profile -->
        <!-- Backend note: client name and email should come from logged-in session -->
        <div class="p-4">
          <a
            href="#"
            aria-label="View profile settings"
            class="transition mb-2 flex items-center gap-3 rounded-[15px] border border-portal-border bg-portal-surface-soft p-[13px] text-portal-text hover:bg-portal-active"
          >
            <div
              id="clientProfileInitials"
              class="flex h-11 w-11 flex-none items-center justify-center rounded-full bg-portal-primary font-bold text-white"
            >
              --
            </div>
            <div class="min-w-0 [overflow-wrap:anywhere]">
              <p id="clientProfileName" class="font-semibold text-[14px]">Loading...</p>
              <p class="text-sm text-portal-muted">Pet Owner</p>
            </div>
          </a>

          <button
            type="button"
            id="clientLogoutBtn"
            class="flex min-h-12 w-full items-center justify-center gap-2 rounded-[14px] border border-portal-border bg-transparent px-4 py-3 font-bold text-portal-primary-hover transition hover:bg-portal-active"
          >
            <svg class="ph-icon h-4 w-4" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#sign-out"></use></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- ===================================================== -->
      <!-- MAIN CONTENT -->
      <!-- ===================================================== -->
      <main class="ml-64 min-w-0 flex-1 min-h-screen transition-[margin-left] duration-[240ms] ease-[ease] max-[1180px]:!ml-0 max-[1180px]:w-full">

        <!-- Header -->
        <header class="sticky top-0 z-30 backdrop-blur border-b border-portal-border bg-white/[0.96]">
          <div class="flex flex-col gap-5 px-6 py-5 min-[1181px]:flex-row min-[1181px]:items-center min-[1181px]:justify-between min-[1181px]:max-[1420px]:flex-wrap max-[1180px]:pl-20 max-[639px]:gap-[18px] max-[639px]:px-4 max-[639px]:py-[18px]">
            <div class="min-w-0 max-[639px]:pl-[62px]">
              <h2 class="text-3xl font-bold text-portal-text max-[639px]:text-[26px]">Grooming History</h2>
              <p class="text-portal-muted mt-1 text-[14px] leading-[1.5]">Review completed grooming sessions for your pets.</p>
            </div>
            <div class="flex items-center flex-none gap-4 min-[1181px]:max-[1420px]:ml-auto max-[1180px]:flex-wrap max-[639px]:gap-2.5">
              <div class="flex min-h-[46px] w-[clamp(210px,18vw,300px)] items-center gap-2.5 rounded-full border border-portal-border bg-portal-surface-soft px-[15px] py-[11px] text-portal-primary focus-within:border-portal-accent max-[1180px]:w-auto max-[1180px]:flex-1 max-[639px]:order-3 max-[639px]:basis-full">
                <svg class="ph-icon w-4 h-4 shrink-0 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#magnifying-glass"></use></svg>
                <input type="text" id="historySearch" placeholder="Search reference or pet name..." aria-label="Search reference or pet name"
                  class="w-full min-w-0 bg-transparent text-sm text-portal-text outline-none placeholder:text-portal-muted focus-visible:!outline-none" />
              </div>

              <div class="relative" id="notifBellWrapper">
                <button id="notifBellBtn" type="button" aria-label="Notifications"
                  class="relative flex h-[46px] w-[46px] items-center justify-center rounded-2xl border border-portal-border bg-portal-surface-soft text-portal-primary-hover transition hover:bg-portal-active"
                  aria-controls="notifDropdown" aria-expanded="false">
                  <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#bell"></use></svg>
                  <span id="notifBadge" class="absolute -right-1 -top-1 hidden min-h-5 min-w-5 items-center justify-center rounded-full bg-portal-danger px-1 text-[10px] font-bold text-white"></span>
                </button>

                <div id="notifDropdown" class="notif-client-dropdown !rounded-2xl !border-portal-border !shadow-portal-dropdown" style="display:none">
                  <div class="flex shrink-0 items-center justify-between border-b border-slate-100 px-4 py-3">
                    <span class="text-sm font-semibold text-portal-text">Notifications</span>
                    <button type="button" id="notifMarkAllRead" class="text-xs text-portal-primary hover:underline">Mark all as read</button>
                  </div>
                  <div id="notifList" class="notif-list divide-y divide-slate-100">
                    <p class="px-4 py-6 text-center text-sm text-portal-muted">Loading...</p>
                  </div>
                </div>
              </div>

              <a id="preRegisterButton" data-pre-registration-button href="#"
                aria-disabled="true" tabindex="-1" title="Checking availability"
                class="portal-button-primary cursor-not-allowed font-semibold opacity-60 max-[639px]:flex-1">
                Pre-register
              </a>
            </div>
          </div>
        </header>

        <!-- Page Body -->
        <section class="p-6 pb-[104px] max-[639px]:p-4 max-[639px]:pb-[100px] space-y-6">

          <div id="historyLoadingScreen" class="flex min-h-[60vh] items-center justify-center text-center" role="status" aria-live="polite">
            <div class="flex flex-col items-center">
              <svg class="ph-icon h-9 w-9 animate-spin text-portal-muted-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#spinner-gap"></use></svg>
              <p class="mt-3 text-sm text-portal-muted">Loading grooming history...</p>
            </div>
          </div>
          <div id="historyContent" class="hidden space-y-6" inert aria-hidden="true">

          <!-- Filters -->
          <div class="flex flex-col gap-3 sm:flex-row">
            <div class="flex h-10 items-center gap-2 rounded-xl border border-portal-border bg-white px-4 shadow-sm">
              <svg class="ph-icon h-4 w-4 text-portal-muted" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#calendar-check"></use></svg>
              <input
                type="date"
                id="historyDateFilter"
                class="h-full min-w-0 bg-transparent outline-none text-sm text-portal-text"
              />
            </div>
            <button
              type="button"
              id="historyClearFilters"
              class="h-10 rounded-xl border border-portal-border bg-white px-4 py-2 text-sm font-semibold text-portal-text shadow-sm transition hover:bg-portal-surface-soft"
            >
              Clear
            </button>
          </div>

          <!-- Summary bar -->
          <div id="historySummary" class="text-sm text-slate-400"></div>

          <!-- History list -->
          <div id="historyList"></div>

          </div>

        </section>
      </main>
    </div>

    <div id="historyModal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 sm:p-6" aria-hidden="true">
      <div data-history-modal-backdrop class="absolute inset-0 bg-[rgba(31,50,69,0.5)]"></div>
      <section id="historyModalDialog" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle" tabindex="-1"
        class="relative flex max-h-[90vh] w-full max-w-[760px] flex-col overflow-hidden rounded-2xl border border-portal-border bg-white shadow-portal-dropdown">
        <div class="flex items-start justify-between gap-4 border-b border-portal-border px-5 py-4 sm:px-6">
          <h2 id="historyModalTitle" class="text-xl font-bold text-portal-text">Grooming Session Details</h2>
          <button type="button" data-history-modal-close aria-label="Close grooming session details"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-portal-muted transition hover:bg-portal-active hover:text-portal-primary">
            <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg#x"></use></svg>
          </button>
        </div>
        <div id="historyModalContent" class="min-h-0 overflow-y-auto px-5 py-5 sm:px-6"></div>
        <div class="flex justify-end border-t border-portal-border px-5 py-4 sm:px-6">
          <button type="button" data-history-modal-close class="min-h-10 rounded-xl border border-portal-border bg-portal-surface-soft px-5 py-2 text-sm font-semibold text-portal-primary-hover transition hover:bg-portal-active">Close</button>
        </div>
      </section>
    </div>
